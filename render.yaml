# Render Blueprint for the FastAPI backend.
# The frontend is deployed separately on Vercel (root directory: frontend).
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Your Vercel URL, e.g. https://zoom-clone.vercel.app (used to build invite links)
      - key: FRONTEND_URL
        sync: false
      # Comma-separated origins allowed to call the API, e.g. https://zoom-clone.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Signs login tokens. Render generates a random value on the first deploy.
      - key: SECRET_KEY
        generateValue: true
